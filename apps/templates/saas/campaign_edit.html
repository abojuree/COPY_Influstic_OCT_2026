{% extends "layouts/base.html" %}

{% block title %} تعديل الحملة {% endblock %}

{% block content %}
<div class="header bg-primary pb-6" dir="rtl">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row align-items-center py-4">
        <div class="col-lg-6 col-7">
          <h6 class="h2 text-white d-inline-block mb-0">تعديل الحملة</h6>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--6" dir="rtl">
  <div class="row">
    <div class="col-xl-8 order-xl-1">
      <div class="card">
        <div class="card-header border-0">
          <div class="row align-items-center">
            <div class="col-8">
              <h3 class="mb-0">تفاصيل الحملة</h3>
            </div>
          </div>
        </div>
        <div class="card-body">
          <form method="POST" action="{{ url_for('saas_blueprint.edit_campaign', campaign_id=campaign.id) }}">
            <h6 class="heading-small text-muted mb-4">المعلومات الأساسية</h6>
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-control-label" for="input-name">اسم الحملة</label>
                    <input type="text" id="input-name" name="name" class="form-control" placeholder="مثال: إطلاق المنتج الجديد" value="{{ campaign.name }}" required>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-4">
                  <div class="form-group">
                    <label class="form-control-label" for="input-platform">المنصة المستهدفة</label>
                    <select id="input-platform" name="target_platform" class="form-control">
                      <option value="all" {% if campaign.target_platform == 'all' %}selected{% endif %}>جميع المنصات</option>
                      <option value="tiktok" {% if campaign.target_platform == 'tiktok' %}selected{% endif %}>تيك توك</option>
                      <option value="instagram" {% if campaign.target_platform == 'instagram' %}selected{% endif %}>انستقرام</option>
                      <option value="snapchat" {% if campaign.target_platform == 'snapchat' %}selected{% endif %}>سناب شات</option>
                    </select>
                  </div>
                </div>
                <div class="col-lg-4">
                  <div class="form-group">
                    <label class="form-control-label" for="input-objective">هدف الحملة</label>
                    <input type="text" id="input-objective" name="objective" class="form-control" placeholder="مثال: زيادة المبيعات، الوعي بالعلامة، إلخ" value="{{ campaign.objective }}" required>
                  </div>
                </div>
                <div class="col-lg-4">
                  <div class="form-group">
                    <label class="form-control-label" for="input-status">الحالة</label>
                    <select id="input-status" name="status" class="form-control">
                      <option value="Active" {% if campaign.status == 'Active' %}selected{% endif %}>نشطة</option>
                      <option value="Completed" {% if campaign.status == 'Completed' %}selected{% endif %}>مكتملة</option>
                      <option value="Paused" {% if campaign.status == 'Paused' %}selected{% endif %}>متوقفة</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            
            <hr class="my-4" />
            <h6 class="heading-small text-muted mb-4">الاستهداف المتخصص</h6>
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-md-12">
                  <div class="form-group">
                    <label class="form-control-label" for="input-keywords">الكلمات المفتاحية (مفصولة بفاصلة)</label>
                    <input type="text" id="input-keywords" name="keywords" class="form-control" placeholder="مثال: تقنية، أزياء، رياضة" value="{{ campaign.keywords }}">
                  </div>
                </div>
              </div>
            </div>
            
            <div class="text-right">
              <button type="submit" class="btn btn-primary mt-4">حفظ التعديلات</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
