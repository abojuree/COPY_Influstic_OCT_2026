{% extends "layouts/base.html" %}

{% block title %} New Campaign {% endblock %}

{% block content %}
<div class="header bg-primary pb-6">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row align-items-center py-4">
        <div class="col-lg-6 col-7">
          <h6 class="h2 text-white d-inline-block mb-0">Create New Campaign</h6>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--6">
  <div class="row">
    <div class="col-xl-8 order-xl-1">
      <div class="card">
        <div class="card-header border-0">
          <div class="row align-items-center">
            <div class="col-8">
              <h3 class="mb-0">Campaign DNA</h3>
            </div>
          </div>
        </div>
        <div class="card-body">
          <form method="POST" action="{{ url_for('saas_blueprint.new_campaign') }}">
            <h6 class="heading-small text-muted mb-4">Core Information</h6>
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-lg-12">
                  <div class="form-group">
                    <label class="form-control-label" for="input-name">Campaign Name</label>
                    <input type="text" id="input-name" name="name" class="form-control" placeholder="e.g. Summer Sneaker Launch" required>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-6">
                  <div class="form-group">
                    <label class="form-control-label" for="input-platform">Target Platform</label>
                    <select id="input-platform" name="target_platform" class="form-control">
                      <option value="all">All Platforms</option>
                      <option value="tiktok">TikTok</option>
                      <option value="instagram">Instagram</option>
                      <option value="snapchat">Snapchat</option>
                    </select>
                  </div>
                </div>
                <div class="col-lg-6">
                  <div class="form-group">
                    <label class="form-control-label" for="input-objective">Campaign Objective</label>
                    <input type="text" id="input-objective" name="objective" class="form-control" placeholder="e.g. Brand Awareness, Sales, etc." required>
                  </div>
                </div>
              </div>
            </div>
            
            <hr class="my-4" />
            <h6 class="heading-small text-muted mb-4">Niche Targeting</h6>
            <div class="pl-lg-4">
              <div class="row">
                <div class="col-md-12">
                  <div class="form-group">
                    <label class="form-control-label" for="input-keywords">Keywords (Comma Separated)</label>
                    <input type="text" id="input-keywords" name="keywords" class="form-control" placeholder="e.g. tech, sneakers, fashion, رياضية">
                  </div>
                </div>
              </div>
            </div>
            
            <div class="text-right">
              <button type="submit" class="btn btn-primary mt-4">Create Campaign</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
